name: CI

on:
  pull_request:
  push:
    branches: [master, ci-debug-diagnostic]

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      # Generates the schema-specific Prisma Client into node_modules/@prisma/client.
      # Reads prisma/schema.prisma only — no DB connection, no env vars required.
      - run: npx prisma generate
      - run: npm run typecheck
      # TEMPORARY diagnostic (this branch only, never merged to master): dump
      # the mojibake test's actual output into the job summary (viewable on
      # the run's Summary tab without GitHub sign-in), since raw step logs
      # require sign-in even on a public repo.
      - name: Run mojibake tests (diagnostic)
        id: mojibaketest
        run: npx vitest run src/ingestion/mojibake.test.ts --reporter=verbose > /tmp/mojibake-output.txt 2>&1
        continue-on-error: true
      - name: Publish diagnostic output as an annotation (readable without sign-in)
        if: always()
        run: |
          ENCODED=$(cat /tmp/mojibake-output.txt | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-6000)
          echo "::error::MOJIBAKE_TEST_OUTPUT: $ENCODED"
          echo "=== also printing hexdump of source lines 20-40 ==="
          sed -n '20,40p' src/ingestion/mojibake.test.ts | od -An -c | head -60
      - name: Fail the job if the diagnostic test actually failed
        if: steps.mojibaketest.outcome == 'failure'
        run: exit 1
