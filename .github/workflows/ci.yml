name: CI

on:
  pull_request:
  push:
    branches: [master, ci-debug-diagnostic]

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      # Generates the schema-specific Prisma Client into node_modules/@prisma/client.
      # Reads prisma/schema.prisma only — no DB connection, no env vars required.
      - run: npx prisma generate
      - run: npm run typecheck
      # TEMPORARY diagnostic split (this branch only, never merged to master):
      # one step per test file, verbose reporter, to isolate which file/case
      # fails in CI when logs can't be viewed without GitHub sign-in.
      - run: npx vitest run src/ingestion/mojibake.test.ts --reporter=verbose
      - run: npx vitest run src/ingestion/csvParser.test.ts --reporter=verbose
      - run: npx vitest run src/ingestion/parseEligibility.test.ts --reporter=verbose
      - run: npx vitest run src/middleware/requireAuth.test.ts --reporter=verbose
      - run: npx vitest run src/routes/auth.test.ts --reporter=verbose
      - run: npx vitest run src/ingestion/ingestEligibility.test.ts --reporter=verbose
      - run: npx vitest run src/ingestion/ingestSchemes.test.ts --reporter=verbose
      - run: npm run build
