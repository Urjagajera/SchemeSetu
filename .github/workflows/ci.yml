name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      # Generates the schema-specific Prisma Client into node_modules/@prisma/client.
      # Reads prisma/schema.prisma only — no DB connection, no env vars required.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
